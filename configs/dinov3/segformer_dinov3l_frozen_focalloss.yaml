# Training configs
model_run: baseline_segformer_dinov3l_frozen_focalloss

# Computation Device
device: cuda

# Images
images:
  resize: [1024, 1024]

# Metadata for normalization
metadata:
  norm_path: metadata/dataset_norm.json

# Logging
logging_level: INFO

# Directories
directories:
  train_dir: data/processed/train/labeled
  val_dir: data/processed/val
  test_dir: data/processed/test
  output_dir: outputs
  checkpoint_dir: model_checkpoints
  log_dir: logs/run_logs

# Training
training:
  epochs: 300
  sanity_check: True

# Model Architecture
model:
  architecture: SEGFORMER
  config:
    encoder_name: facebook/dinov3-vitl16-pretrain-lvd1689m
    encoder_depth: 5
    encoder_weights: dinov3
    input_channels: 3
    classes: 12

# Optimizer stuff
optimizer:
  name: AdamW
  weight_decay: 0.001
  filter_bias_and_bn: True
  ema: True
  ema_decay: 0.9
  optimizer_params: 
    lr: 0.003
    momentum: 0.9
    nesterov: True
    gamma: 0.99

# Scheduler stuff
scheduler:
  name: ExponentialLR
  gamma: 0.99

# Criterion / Loss Function
loss:
  name: FOCALLOSS
  reduction: mean
  smooth: 0.05
  gamma: 2.0

# Batch Sizes
batch_size: 2

# Multi-processing
num_workers: 6