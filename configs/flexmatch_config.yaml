# Training configs
model_run: flexmatch_baseline_lam=0.3_segformer_enb3_tvmfdiceloss_k=16

# Computation Device
device: cuda

# Images
images:
  resize: [1024, 1024]

# Metadata for normalization
metadata:
  norm_path: metadata/dataset_norm.json

# Logging
logging_level: INFO

# Directories
directories:
  train_labeled_dir: data/processed/train/labeled
  train_unlabeled_dir: data/processed/train/unlabeled
  val_dir: data/processed/val
  test_dir: data/processed/test
  output_dir: outputs
  checkpoint_dir: model_checkpoints
  log_dir: logs/run_logs
  starting_checkpoint_path: model_checkpoints/baseline_segformer_enb3_tvmfdiceloss_k=16_2026-05-21_16.05.05/baseline_segformer_enb3_tvmfdiceloss_k=16_2026-05-21_16.05.05_epoch_108_fitness-0.635833.pth
# Training
training:
  epochs: 200

# Model Architecture
model:
  architecture: SEGFORMER
  config:
    encoder_name: efficientnet-b3
    encoder_depth: 5
    encoder_weights: imagenet
    input_channels: 3
    classes: 12

# Optimizer stuff
optimizer:
  name: AdamW
  weight_decay: 0.001
  filter_bias_and_bn: True
  ema: True
  ema_decay: 0.99
  optimizer_params: 
    lr: 0.001
    momentum: 0.9
    nesterov: True
    gamma: 0.99

# Scheduler stuff
scheduler:
  name: ExponentialLR
  gamma: 0.99

# Criterion / Loss Function
loss:
  name: TVMFDICELOSS
  reduction: mean
  smooth: 0.05
  kappa: 16

# Flexmatch
flexmatch:
  tau: 0.85
  mapping: linear
  warmup: True
  l_batch_size: 2
  u_batch_size: 4
  lam: 0.3

# Wandb
wandb:
  entity: oxbowsolutions
  project: pgcview_v2
  vis_alpha: 0.4
  num_vis_images: 8
