# Training configs
model_run: flexmatch_no_baseline_lam=0.5_segformer_enb1_tvmfdiceloss_k=16

# Computation Device
device: cuda

# Images
images:
  resize: [1024, 1024]

# Metadata for normalization
metadata:
  norm_path: metadata/dataset_norm.json

# Logging
logging_level: DEBUG
tb_exclude_classes: [8, 9, 10, 11]

# Directories
directories:
  train_labeled_dir: data/processed/train/labeled
  train_unlabeled_dir: data/processed/train/unlabeled
  val_dir: data/processed/val
  test_dir: data/processed/test
  output_dir: outputs
  checkpoint_dir: model_checkpoints
  log_dir: logs/run_logs
  starting_checkpoint_path: model_checkpoints/baseline_segformer_enb1_tvmfdiceloss_k=16_2025-12-25_13.12.16/baseline_segformer_enb1_tvmfdiceloss_k=16_2025-12-25_13.12.16_latest_epoch_200_vloss-1.319348.pth

# Training
training:
  epochs: 200
  sanity_check: True

# Model Architecture
model:
  architecture: SEGFORMER
  config:
    encoder_name: efficientnet-b1
    encoder_depth: 5
    encoder_weights: imagenet
    input_channels: 3
    classes: 12

# Optimizer stuff
optimizer:
  name: AdamW
  weight_decay: 0.001
  filter_bias_and_bn: True
  ema: True
  ema_decay: 0.99
  optimizer_params: 
    lr: 0.001
    momentum: 0.9
    nesterov: True
    gamma: 0.99

# Scheduler stuff
scheduler:
  name: ExponentialLR
  gamma: 0.99

# Criterion / Loss Function
loss:
  name: TVMFDICELOSS
  reduction: mean
  smooth: 0.05
  kappa: 16

# Flexmatch
flexmatch:
  tau: 0.95
  mapping: linear
  warmup: True
  l_batch_size: 2
  u_batch_size: 4
  lam: 0.3
